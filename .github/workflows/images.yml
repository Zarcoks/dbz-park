# Builds the back and front images and publishes them on GHCR,
# where the Kubernetes cluster pulls them (see kub/app/).
name: images

on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The cluster nodes are x86_64.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zarcoks/dbz-park-${{ matrix.component }}:latest
            ghcr.io/zarcoks/dbz-park-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
