# PostgreSQL: a StatefulSet (1 replica) with its own persistent volume,
# behind a headless Service (stable DNS name dbz-db-0.dbz-db, no virtual IP).
apiVersion: v1
kind: Service
metadata:
  name: dbz-db
  labels: { app: dbz-db, app.kubernetes.io/part-of: dbz-park }
spec:
  clusterIP: None                  # headless: DNS points straight to the Pod
  selector: { app: dbz-db }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dbz-db
  labels: { app: dbz-db, app.kubernetes.io/part-of: dbz-park }
spec:
  serviceName: dbz-db
  replicas: 1                      # a single primary: never scale this up
  selector:
    matchLabels: { app: dbz-db }
  template:
    metadata:
      labels: { app: dbz-db, app.kubernetes.io/part-of: dbz-park }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: dbz-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: dbz-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dbz-secrets, key: POSTGRES_PASSWORD } }
            # The volume root holds lost+found: Postgres wants an empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 100Mi }
            limits: { cpu: 200m, memory: 200Mi }
  # One PersistentVolumeClaim per replica (here dbz-db-data-dbz-db-0): it outlives the Pod.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
